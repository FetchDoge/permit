name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Matrix job id must not be `test` — the branch ruleset requires a check
  # named exactly "test", provided by the aggregate gate below.
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install --upgrade pip "pytest>=8" "pytest-cov>=5"
      - name: tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q -rs
      - name: tests with coverage
        if: matrix.python-version == '3.12'
        run: >
          python -m pytest -q -rs
          --cov=permit --cov=settlement
          --cov-report=xml:coverage.xml
          --cov-report=term-missing:skip-covered
      - name: key-file tests by name
        if: matrix.python-version == '3.12'
        # Named -v pass lines for REA (sudo chown foreign-owner must not skip).
        run: >
          python -m pytest -v -rs
          tests/test_demo_key_rea_n_b.py::test_chmod_000_key_file_is_clean_valueerror
          tests/test_demo_key_rea_n_b.py::test_chmod_000_server_exits_clean_no_traceback
          tests/test_demo_key_rea_n_b.py::test_foreign_owner_real_chown_clean_valueerror
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: mock demo smoke
        if: matrix.python-version == '3.12'
        env:
          # Test-only key for the smoke path (#53: demo key is off by default).
          PERMIT_ACCEPTANCE_KEY: permit-ci-only-key-32bytes!!!!!!
        run: python demo.py

  test-optimized:
    name: pytest (python -O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --upgrade pip "pytest>=8"
      - name: tests under -O
        # Asserts are stripped under -O; suite must still pass (trust-boundary asserts are a known debt).
        run: python -O -m pytest -q -rs

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install ruff
        run: python -m pip install --upgrade pip "ruff>=0.8"
      - name: ruff check (report-only)
        # Report-only until the 34-finding baseline is cleared (listed in PR body).
        run: |
          set +e
          ruff check permit settlement tests agent scenarios server.py demo.py trace.py launch_sandbox.py
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::ruff found issues (report-only; see PR body)"
          fi
          exit 0

  security:
    name: security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install bandit
        run: python -m pip install --upgrade pip "bandit>=1.7"
      - name: bandit (permit/, settlement/) (report-only)
        # Report-only until assert/urlopen findings are triaged (listed in PR body).
        run: |
          set +e
          bandit -r permit settlement -f txt
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::bandit found issues (report-only; see PR body)"
          fi
          exit 0
      - name: pip-audit
        run: |
          # Fresh venv so only the project + test extra graph is audited (no
          # PayPal/runtime secrets; project runtime deps are empty).
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install -e ".[test]" "pip-audit>=2.7"
          .audit-venv/bin/pip-audit --progress-spinner off
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: gitleaks
        run: ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  # Required branch-ruleset check name. Aggregates pytest matrix, -O, and security.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [pytest, test-optimized, security]
    if: always()
    steps:
      - name: aggregate gate
        run: |
          echo "pytest=${{ needs.pytest.result }}"
          echo "test-optimized=${{ needs.test-optimized.result }}"
          echo "security=${{ needs.security.result }}"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.test-optimized.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
