<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permit — payment authority for agents</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3;
          --dim:#8b949e; --green:#3fb950; --red:#f85149; --amber:#d29922;
          --blue:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font:14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         padding:24px; max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  header h1 { font-size:20px; font-weight:600; letter-spacing:.5px; }
  header h1 span { color:var(--dim); font-weight:400; }
  .badge { font-size:11px; padding:3px 10px; border-radius:20px;
           border:1px solid var(--line); color:var(--dim); }
  .badge.ok { color:var(--green); border-color:var(--green); }
  .badge.bad { color:var(--red); border-color:var(--red); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px;
             color:var(--dim); margin-bottom:12px; }
  .permit { border-left:3px solid var(--blue); }
  .permit.revoked { border-left-color:var(--red); opacity:.75; }
  .money { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
  .money small { font-size:13px; color:var(--dim); font-weight:400; }
  .bar { height:8px; background:#21262d; border-radius:4px; margin:10px 0 6px; }
  .bar i { display:block; height:100%; border-radius:4px;
           background:linear-gradient(90deg,var(--blue),var(--green));
           transition:width .4s; }
  .kv { display:flex; justify-content:space-between; font-size:12px;
        color:var(--dim); padding:2px 0; }
  .kv b { color:var(--txt); font-weight:500; font-variant-numeric:tabular-nums; }
  .mono { font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; }
  button.estop { margin-top:12px; width:100%; padding:10px; border-radius:6px;
    border:1px solid var(--red); background:transparent; color:var(--red);
    font-size:13px; font-weight:600; letter-spacing:1px; cursor:pointer; }
  button.estop:hover { background:var(--red); color:#fff; }
  button.estop:disabled { opacity:.35; cursor:default; }
  button.estop:disabled:hover { background:transparent; color:var(--red); }
  .escrow { display:flex; justify-content:space-between; align-items:center;
            padding:8px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .escrow:last-child { border-bottom:none; }
  .st { font-size:10px; padding:2px 8px; border-radius:12px; font-weight:600;
        letter-spacing:.5px; }
  .st.AUTHORIZED { background:#1f3a5f; color:var(--blue); }
  .st.CAPTURED { background:#1a3a24; color:var(--green); }
  .st.VOIDED { background:#3a2a1a; color:var(--amber); }
  .st.REFUSED { background:#3a1a1a; color:var(--red); }
  #chain { max-height:420px; overflow-y:auto; }
  .rcpt { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line);
          font-size:12px; align-items:baseline; }
  .rcpt:last-child { border-bottom:none; }
  .seq { color:var(--dim); min-width:34px; }
  .ev { font-weight:600; font-size:11px; min-width:92px; }
  .ev.GRANTED{color:var(--blue);} .ev.ALLOWED{color:var(--green);}
  .ev.AUTHORIZED{color:var(--blue);} .ev.CAPTURED{color:var(--green);}
  .ev.BLOCKED{color:var(--amber);} .ev.REFUSED{color:var(--red);}
  .ev.VOIDED{color:var(--amber);} .ev.REVOKED{color:var(--red);}
  .ev.DELEGATED{color:var(--blue);} .ev.REVOKED_CASCADE{color:var(--red);}
  .ev.CARVE_RELEASED{color:var(--green);} .ev.E-STOP{color:var(--red);}
  .detail { color:var(--dim); }
  .empty { color:var(--dim); font-style:italic; padding:12px 0; }
  #err { color:var(--red); font-size:12px; margin-bottom:12px; display:none; }
  .node { border-left:2px solid var(--line); margin:4px 0 4px 8px;
          padding:8px 0 8px 12px; }
  .node.root { border-left-color:var(--blue); }
  .node.revoked { border-left-color:var(--red); opacity:.78; }
  .nodehead { display:flex; justify-content:space-between; align-items:baseline;
              gap:8px; font-size:12px; flex-wrap:wrap; }
  .carve { color:var(--amber); font-size:11px; margin:2px 0 4px; }
  .carve.released { color:var(--green); }
  .controls { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .ctl { font-size:10px; font-weight:600; letter-spacing:.5px; padding:4px 10px;
         border-radius:4px; border:1px solid var(--line); background:transparent;
         color:var(--dim); cursor:pointer; }
  .ctl:hover { border-color:var(--dim); color:var(--txt); }
  .ctl.danger { border-color:var(--red); color:var(--red); }
  .ctl.danger:hover { background:var(--red); color:#fff; }
  .ctl:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>PERMIT <span>payment authority for agents</span></h1>
  <span class="badge ok" id="chainBadge">chain verifying…</span>
</header>
<div id="err"></div>
<div class="grid">
  <div>
    <div class="card"><h2>Permits</h2><div id="permits"></div></div>
    <div class="card"><h2>Delegation graph</h2><div id="graph"></div></div>
    <div class="card"><h2>Pending approvals</h2><div id="approvals"></div></div>
    <div class="card"><h2>In-flight escrows</h2><div id="escrows"></div></div>
  </div>
  <div class="card"><h2>Receipt chain</h2><div id="chain"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const cents = c => "$" + (c/100).toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Advisory calibration score (Sol 6.1): display only, never blocks a spend.
function calib(p){
  const c = p.calibration;
  if(!c) return "";
  if(typeof c.S !== "number") return " · S n/a (advisory)";
  return ` · S ${c.S.toFixed(2)} ${esc(c.verdict||"")} τ ${Number(c.tau).toFixed(2)} (advisory)`;
}

function receiptDetail(r){
  const p = r.payload || {};
  switch(r.event){
    case "GRANTED": return `cap ${cents(p.cap_cents)} · ${esc(p.agent_id)}`;
    case "ALLOWED": return `${cents(p.amount_cents)} · ${esc(p.merchant_id||"")}${calib(p)}`;
    case "BLOCKED": return `${cents(p.amount_cents||0)} · ${esc(p.reason||"")}${calib(p)}`;
    case "TAU_RAISED": return `advisory τ ${esc(p.from)} → ${esc(p.to)} · ${esc(p.actor||"")}`;
    case "TAU_REFUSED": return `advisory τ ${esc(p.requested_tau)} refused · ${esc(p.reason||"")}`;
    case "AUTHORIZED": return `${cents(p.amount_cents)} · paypal ${esc((p.paypal_auth_id||"").slice(0,14))}…`;
    case "CAPTURED": return `${cents(p.amount_cents)} · capture ${esc((p.paypal_capture_id||"").slice(0,14))}…`;
    case "REFUSED": return esc(p.reason||"");
    case "VOIDED": return `escrow ${esc((p.escrow_id||"").slice(0,12))}…`;
    case "REVOKED": return `permit ${esc((p.permit_id||"").slice(0,12))}…`;
    case "E-STOP": return `permit ${esc((p.permit_id||"").slice(0,12))}… revoked`;
    case "DELEGATED": return `cap ${cents(p.cap_cents)} · ${esc(p.agent_id||"")} · parent ${esc((p.parent_permit_id||"").slice(0,12))}…`;
    case "REVOKED_CASCADE": return `cascade from ${esc((p.parent_id||"").slice(0,12))}… · revoked ${esc((p.permit_id||"").slice(0,12))}…`;
    case "CARVE_RELEASED": return `${cents(p.released_cents||0)} back to parent ${esc((p.parent_permit_id||"").slice(0,12))}…`;
    case "APPROVAL_REQUESTED": return `${cents(p.amount_cents)} · ${esc(p.merchant_id||"")} · needs principal`;
    case "APPROVAL_DECIDED": return `${esc(p.decision||"")} · ${esc(p.actor||"")}`;
    case "APPROVAL_PENDING": return `${cents(p.amount_cents)} · waiting on principal`;
    default: return "";
  }
}

async function decideApproval(id, approve){
  const res = await fetch(`/api/approvals/${id}/${approve?"approve":"deny"}`,{method:"POST"});
  const j = await res.json();
  if(!j.ok) alert("decision failed: "+(j.error||"unknown"));
  refresh();
}

async function estop(pid){
  if(!confirm("E-STOP: revoke this permit and void every in-flight escrow?")) return;
  const res = await fetch("/api/estop",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({permit_id:pid})});
  const j = await res.json();
  if(!j.ok) alert("e-stop failed: "+(j.error||"unknown"));
  refresh();
}

async function revokeTree(pid){
  if(!confirm("Revoke this permit AND every descendant sub-permit (revocation wins the race)?")) return;
  const res = await fetch("/api/revoke-cascade",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({permit_id:pid})});
  const j = await res.json();
  if(!j.ok) alert("revoke-cascade failed: "+(j.error||"unknown"));
  refresh();
}

async function tightenPermit(pid, capCents){
  const v = prompt(`Tighten cap for ${pid} (current cap ${cents(capCents)}).\nNew cap must be lower — authority only ever narrows:`, "");
  if(v === null) return;
  const nc = Math.round(Number(v.replace(/[^0-9.]/g,"")) * 100);
  if(!nc || nc <= 0){ alert("enter a positive amount"); return; }
  const res = await fetch("/api/tighten",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({permit_id:pid, cap_cents:nc})});
  const j = await res.json();
  if(!j.ok) alert("tighten failed: "+(j.error||"unknown"));
  refresh();
}

function renderGraph(s){
  // Carve and release ledger facts join permits into a delegation tree.
  // Cascaded children lose their parent_id when the carve is released, so
  // REVOKED_CASCADE receipts re-attach them under their revoked parent for
  // the demo view ("revoked subtrees render distinctly").
  const byId = {}; s.permits.forEach(p => byId[p.permit_id] = p);
  const carve = {}, released = {}, cascadeParent = {};
  s.receipts.forEach(r => {
    const p = r.payload || {};
    if(r.event === "DELEGATED") carve[p.child_permit_id] = p.cap_cents;
    if(r.event === "CARVE_RELEASED") released[p.child_permit_id] = p.released_cents;
    if(r.event === "REVOKED_CASCADE") cascadeParent[p.permit_id] = p.parent_id;
  });
  const kids = {}, via = {};
  s.permits.forEach(p => {
    let parent = p.parent_id, how = "live";
    if(!parent && p.revoked && cascadeParent[p.permit_id] && byId[cascadeParent[p.permit_id]]){
      parent = cascadeParent[p.permit_id]; how = "cascade";
    }
    if(parent){ (kids[parent] = kids[parent] || []).push(p.permit_id); via[p.permit_id] = how; }
  });
  const hasParent = new Set(Object.keys(via));
  const roots = s.permits.filter(p => !hasParent.has(p.permit_id));

  function edgeLabel(id){
    if(carve[id] == null) return "";
    if(released[id] != null)
      return `<div class="carve released">carve ${cents(carve[id])} released${via[id]==="cascade"?" by cascade":""} back to parent</div>`;
    return `<div class="carve">carved ${cents(carve[id])} from parent · still held</div>`;
  }
  function node(p, depth){
    const dis = p.revoked ? "disabled" : "";
    const status = p.revoked
      ? (via[p.permit_id]==="cascade" ? "REVOKED · cascade" : "REVOKED")
      : "active";
    const capLine = (p.effective_cap_cents != null && p.effective_cap_cents < p.cap_cents)
      ? `<span style="color:var(--dim)">remaining of ${cents(p.effective_cap_cents)} (tightened from ${cents(p.cap_cents)})</span>`
      : `<span style="color:var(--dim)">remaining of ${cents(p.cap_cents)}</span>`;
    let h = `<div class="node${depth===0?" root":""}${p.revoked?" revoked":""}">`;
    h += edgeLabel(p.permit_id);
    h += `<div class="nodehead"><span><b>${esc(p.agent_id)}</b>
      <span class="mono" style="color:var(--dim)">${esc(p.permit_id.slice(0,14))}…</span></span>
      <span><b>${cents(p.remaining_cents)}</b> ${capLine}</span></div>`;
    h += `<div class="kv"><span>reserved</span><b>${cents(p.reserved_cents)}</b></div>
          <div class="kv"><span>captured</span><b>${cents(p.captured_cents)}</b></div>
          <div class="kv"><span>status</span><b>${status}</b></div>`;
    h += `<div class="controls">
      <button class="ctl danger" ${dis} onclick="revokeTree('${esc(p.permit_id)}')">REVOKE TREE</button>
      <button class="ctl" ${dis} onclick="tightenPermit('${esc(p.permit_id)}',${p.effective_cap_cents||p.cap_cents})">TIGHTEN</button>
    </div>`;
    (kids[p.permit_id]||[]).forEach(cid => { h += node(byId[cid], depth+1); });
    return h + `</div>`;
  }
  return roots.length
    ? roots.map(p => node(p, 0)).join("")
    : `<div class="empty">no permits yet</div>`;
}

async function refresh(){
  try{
    const s = await (await fetch("/api/state")).json();
    $("err").style.display = "none";
    const cb = $("chainBadge");
    cb.textContent = s.chain_ok ? "chain intact · "+s.receipts.length+" receipts"
                                : "CHAIN BROKEN";
    cb.className = "badge " + (s.chain_ok ? "ok" : "bad");

    $("permits").innerHTML = s.permits.length ? s.permits.map(p=>{
      const pct = p.cap_cents ? Math.max(0,100*p.remaining_cents/p.cap_cents) : 0;
      return `<div class="permit card ${p.revoked?"revoked":""}">
        <div class="mono" style="color:var(--dim)">${esc(p.permit_id)}</div>
        ${p.parent_id?`<div class="mono" style="color:var(--dim);font-size:11px">sub-permit of ${esc(p.parent_id.slice(0,14))}…</div>`:""}
        <div class="money">${cents(p.remaining_cents)} <small>remaining of ${cents(p.cap_cents)}</small></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="kv"><span>reserved</span><b>${cents(p.reserved_cents)}</b></div>
        <div class="kv"><span>captured</span><b>${cents(p.captured_cents)}</b></div>
        <div class="kv"><span>allowlist</span><b class="mono">${p.allowlist.map(esc).join(", ")}</b></div>
        <div class="kv"><span>status</span><b>${p.revoked?"REVOKED":"active"}</b></div>
        <button class="estop" ${p.revoked?"disabled":""}
          onclick="estop('${esc(p.permit_id)}')">E-STOP</button>
      </div>`;
    }).join("") : `<div class="empty">no permits yet</div>`;

    $("escrows").innerHTML = s.escrows.length ? s.escrows.map(e=>
      `<div class="escrow"><span class="mono">${esc(e.escrow_id.slice(0,14))}… ·
        ${cents(e.amount_cents)}</span>
        <span class="st ${e.state}">${e.state}</span></div>`
    ).join("") : `<div class="empty">no escrows in flight</div>`;

    $("graph").innerHTML = renderGraph(s);

    $("approvals").innerHTML = (s.approvals||[]).length ? s.approvals.map(a=>
      `<div class="escrow"><span>${cents(a.amount_cents)} · ${esc(a.merchant_id)}<br>
        <span class="mono" style="color:var(--dim)">${esc(a.agent_id)} · expires ${esc(a.expires_at.slice(11,16))} UTC</span></span>
        <span><button class="st" style="color:var(--green);border-color:var(--green);background:none;cursor:pointer;margin-right:6px"
          onclick="decideApproval('${esc(a.approval_id)}',true)">APPROVE</button><button class="st"
          style="color:var(--red);border-color:var(--red);background:none;cursor:pointer"
          onclick="decideApproval('${esc(a.approval_id)}',false)">DENY</button></span></div>`
    ).join("") : `<div class="empty">no pending approvals</div>`;

    $("chain").innerHTML = s.receipts.length ? [...s.receipts].reverse().map(r=>
      `<div class="rcpt"><span class="seq">#${String(r.seq).padStart(2,"0")}</span>
       <span class="ev ${r.event}">${r.event}</span>
       <span class="detail">${receiptDetail(r)}</span></div>`
    ).join("") : `<div class="empty">no receipts yet</div>`;
  }catch(e){ const el=$("err"); el.style.display="block";
    el.textContent="dashboard link lost — retrying…"; }
}
setInterval(refresh, 1000); refresh();
</script>
</body>
</html>
