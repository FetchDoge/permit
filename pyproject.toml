[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permit"
version = "0.4.0"
description = "Payment authority layer for AI agents: scoped permits, pre-action gate, hash-chained receipt log, kill-switch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["permit*", "settlement*", "agent*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
